<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        DataLens
        {% endblock %}
    </title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body{% if request.endpoint == 'home' %} class="landing-page"{% endif %}>

<nav class="navbar{% if request.endpoint == 'home' %} navbar-home{% endif %}">

    <a href="{{ url_for('home') }}" class="logo">
        Data<span>Lens</span>
    </a>

    {% if request.endpoint == 'home' %}
    <div class="home-nav-links">
        <a href="#workflow">How it works</a>
        <a href="#capabilities">Capabilities</a>
        <a href="#upload" class="home-nav-cta">Start exploring <span aria-hidden="true">&rarr;</span></a>
    </div>
    {% else %}
    <div class="nav-links">

        <a href="{{ url_for('dataset') }}">Dataset</a>

        <a href="{{ url_for('profiling') }}">Explore</a>

        <a href="{{ url_for('preparation') }}">Prepare</a>

        <a href="{{ url_for('visualize') }}">Visualize</a>

        <a href="{{ url_for('statistics') }}">Statistics</a>

        <a href="{{ url_for('relationships') }}">Relationships</a>

        <a href="{{ url_for('multivariate') }}">Multivariate</a>

        <a href="{{ url_for('pca') }}">PCA</a>

        <a href="{{ url_for('machine_learning') }}">ML Lab</a>

        <a href="{{ url_for('insights') }}">Insights</a>

        <a href="{{ url_for('report') }}">Report</a>

    </div>
    {% endif %}

</nav>


<main>

    {% block content %}

    {% endblock %}

</main>


<script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>

</html>
