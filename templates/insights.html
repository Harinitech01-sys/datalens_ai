{% extends "base.html" %}

{% block title %}Insights — DataLens{% endblock %}

{% block content %}

<div class="container">

    <div class="page-header">

        <h1>Data Insights</h1>

        <p>
            Automatically generated observations from your dataset.
        </p>

    </div>


    <div class="card">

        {% for insight in insights %}

        <div class="insight">

            <div class="insight-number">
                {{ loop.index }}
            </div>

            <div>
                {{ insight }}
            </div>

        </div>

        {% endfor %}

    </div>

</div>

{% endblock %}
